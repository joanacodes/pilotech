# Questions fréquentes. Réécrites pour le site unifié (formulation distincte des sites satellites).
climatisation:
  - q: "Monosplit ou multisplit : comment choisir ?"
    a: "Le monosplit associe une unité intérieure à un seul groupe extérieur : c'est la configuration la plus simple et la moins coûteuse pour traiter une pièce. Le multisplit fait fonctionner jusqu'à cinq unités intérieures depuis un même groupe extérieur, chacune avec son propre réglage. On y gagne une seule machine en façade et un budget inférieur à celui de plusieurs monosplits."
  - q: "Une climatisation réversible suffit-elle pour se chauffer l'hiver ?"
    a: "Oui. Chaque gamme Toshiba que nous posons est réversible : l'appareil rafraîchit l'été et chauffe l'hiver, avec un rendement très supérieur à celui d'un radiateur électrique. La gamme Super Heating a été conçue pour garder ses performances par grand froid, jusqu'à −25 °C dehors. Une limite à connaître : une pompe à chaleur air-air ne produit pas d'eau chaude sanitaire."
  - q: "Quel modèle privilégier dans une chambre ?"
    a: "Le niveau sonore fait la différence. Yukai, Naka, Shorai Edge et Shorai Curve descendent à 19 dB(A) en mode nuit, un niveau proche du silence. Si l'esthétique compte autant, le Haori se décline en quinze habillages textiles et le Shorai Curve joue la carte des lignes arrondies, en noir ou blanc mat."
  - q: "Peut-on climatiser sans rien voir dans les pièces ?"
    a: "C'est le principe du gainable : l'unité se loge dans un faux plafond ou dans les combles et seules les grilles de soufflage restent apparentes. Le gainable compact convient aux faibles hauteurs, le gainable standard aux grandes surfaces, avec un pilotage pièce par pièce en option. Le chantier est en revanche plus conséquent que pour un mural."
  - q: "Faut-il l'accord de la copropriété ?"
    a: "Le plus souvent, oui. Le groupe extérieur modifie l'aspect de la façade ou du balcon, ce qui relève d'un vote en assemblée générale. Les règles dépendent de chaque règlement de copropriété. Nous préparons avec vous le dossier technique à présenter ; la démarche auprès du syndic reste la vôtre."
  - q: "Que veulent dire A+++ et SCOP ?"
    a: "L'étiquette énergie classe l'appareil de A+++ à D, séparément pour le chauffage et pour le rafraîchissement. Le SCOP est le rendement saisonnier en chauffage : un SCOP de 5,1 signifie que l'appareil restitue en moyenne 5,1 kWh de chaleur pour 1 kWh d'électricité. Le SEER est l'équivalent en mode froid. Ces valeurs figurent sur chaque fiche du site."
  - q: "L'entretien annuel est-il imposé ?"
    a: "Au-delà d'un certain seuil de charge en fluide frigorigène, la réglementation impose un contrôle d'étanchéité périodique. En dessous, l'entretien n'est pas obligatoire mais reste fortement recommandé : nettoyage des filtres, contrôle des pressions et vérification des condensats préservent les performances et la qualité de l'air."
  - q: "Peut-on piloter l'installation depuis son téléphone ?"
    a: "Oui. Toutes les gammes installées sont compatibles avec l'application Toshiba Home AC Control, en Wi-Fi intégré ou via une interface ajoutée selon le modèle. Vous réglez la température avant de rentrer, programmez des plages horaires et suivez votre consommation depuis votre smartphone."
  - q: "Combien de temps prend l'installation ?"
    a: "Comptez une journée pour un monosplit, deux à trois jours pour un multisplit ou un gainable. La visite technique préalable sert précisément à repérer les passages de liaisons frigorifiques et à annoncer une durée ferme."
ventilation:
  - q: "Qu'est-ce qu'une ventilation par insufflation ?"
    a: "Au lieu d'extraire l'air des pièces humides comme une VMC classique, une centrale VMI insuffle de l'air neuf filtré dans le logement, en légère surpression. L'air vicié et l'humidité sont poussés vers l'extérieur par les grilles et les défauts d'étanchéité naturels du bâti. Il n'y a qu'un seul point d'entrée à créer, ce qui rend la pose possible sans réseau de gaines dans la plupart des logements."
  - q: "Comment savoir si mon logement manque de ventilation ?"
    a: "Condensation sur les vitres le matin, joints de salle de bain qui noircissent, taches sombres dans les angles, odeur de renfermé au retour d'absence, allergies qui s'aggravent chez soi : ces signes indiquent un renouvellement d'air insuffisant. Une mesure du taux d'humidité et un contrôle des débits permettent de confirmer le diagnostic."
  - q: "Quel modèle pour un appartement sans combles ?"
    a: "Wally et Cube ont été dessinés pour les logements sans volume technique : ils se posent dans un placard, un cellier ou directement sur un mur, avec un seul carottage vers l'extérieur. L'Urban 2, très compact et silencieux, est l'autre option des petits logements en rénovation."
  - q: "Combien de temps dure la pose d'une VMI ?"
    a: "Pour une centrale compacte (Wally, Cube, Cave, Lofty, Urban 2), une demi-journée à une journée suffit, sans gros œuvre. Une centrale Purevent avec distribution par pièce depuis les combles ou une Pro 1000 en établissement recevant du public demande davantage de préparation : nous annonçons la durée après la visite technique."
  - q: "Existe-t-il des aides financières ?"
    a: "Selon le logement et le matériel retenu, plusieurs dispositifs peuvent s'appliquer : MaPrimeRénov', l'éco-prêt à taux zéro, les certificats d'économies d'énergie et parfois des aides locales franciliennes. Les conditions changent régulièrement ; nous faisons le point avec vous au moment du devis."
  - q: "Quel entretien prévoir ?"
    a: "Un passage par an : remplacement du filtre, nettoyage des grilles et contrôle du moteur. Les centrales VMI affichent l'encrassement du filtre, ce qui permet d'anticiper. Un entretien régulier maintient les débits et la qualité de l'air d'une année sur l'autre."
invisible:
  - q: "Comment une climatisation peut-elle fonctionner sans unité extérieure ?"
    a: "Le groupe de condensation, normalement posé en façade, est intégré à l'appareil intérieur. Chez Teknopoint, deux principes existent : les gammes ELFO, Moka et Piccolo rejettent la chaleur par deux grilles discrètes de 20 cm percées dans le mur extérieur ; les gammes IDRA Next sont refroidies à l'eau et n'ont besoin d'aucune grille, seulement d'un raccordement hydraulique."
  - q: "Dans quels cas la choisir plutôt qu'une climatisation classique ?"
    a: "Quand la façade ne peut pas recevoir de groupe extérieur : immeuble classé ou en secteur sauvegardé, copropriété qui refuse toute machine en façade, local sans accès à l'extérieur, boutique en rez-de-chaussée d'un centre historique. C'est une réponse à une contrainte, avec des puissances qui restent adaptées à un appartement, un bureau ou un commerce."
  - q: "Est-ce bruyant à l'intérieur ?"
    a: "Le compresseur se trouve dans l'unité intérieure, d'où l'importance de son emplacement : un placard, un local technique ou un faux plafond. Les centrales IDRA Next sont insonorisées et annoncées à 41 dB(A), le niveau d'un réfrigérateur ; les ELFO utilisent des ventilateurs centrifuges à faible niveau sonore. La visite technique sert précisément à choisir l'emplacement le plus discret."
  - q: "Peut-on chauffer avec ces appareils ?"
    a: "Oui pour les gammes ELFO, IDRA Next et IDRA Eco, qui sont réversibles et déshumidifient aussi. Le Moka existe en version réversible à partir de 10 000 BTU/h. Le Piccolo, le plus compact de la gamme, est prévu pour le rafraîchissement seul."
  - q: "Faut-il quand même l'accord de la copropriété ?"
    a: "Le plus souvent oui, même sans machine en façade : les deux grilles de 20 cm des gammes à air modifient l'aspect extérieur, et les gammes à eau demandent un raccordement au réseau. Nous préparons avec vous le dossier technique, qui est en général beaucoup plus simple à faire accepter qu'un groupe extérieur."
