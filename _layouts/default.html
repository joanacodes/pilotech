<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  {% include head.html %}
</head>
<body class="min-h-screen flex flex-col">
  <div id="preloader" class="preloader" aria-hidden="true">
    <img src="{{ '/assets/img/brand/pilotech-logo-dark.png' | relative_url }}" alt="" width="674" height="192" class="preloader-logo" fetchpriority="high">
    <div class="thermal" data-draw></div>
  </div>
  <noscript><style>.preloader { display: none; }</style></noscript>
  <a href="#contenu" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[100] focus:rounded focus:bg-paper focus:px-4 focus:py-2 focus:text-ink">Aller au contenu</a>
  {% include header.html %}
  {% include breadcrumb.html %}
  <main id="contenu" class="flex-1">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
